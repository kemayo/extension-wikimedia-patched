# Build a release when a version tag is pushed, such as v1.2.3.
#
# The release holds a zip for each browser. If the AMO API keys are set as
# repository secrets (AMO_JWT_ISSUER and AMO_JWT_SECRET), it also holds a
# signed Firefox XPI: release Firefox refuses an unsigned add-on. The
# signing uses the unlisted channel, so the add-on is not on the AMO site.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not v and a version, such as v1.2.3."
            exit 1
          fi
          package="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$package" ]; then
            echo "::warning::Tag says $version but package.json says $package. The release uses $version."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Installs less, which the build bundles into the extension.
      - run: npm ci

      # npm test builds first, so this is the build that ships. The update
      # URL is the newest release's updates.json, which GitHub serves at a
      # stable address.
      - name: Build and test
        env:
          WMP_VERSION: ${{ steps.version.outputs.version }}
          WMP_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/updates.json
        run: npm test

      - name: Check that the LESS compiler is in the build
        run: |
          if ! grep -q "lessFactory" dist/chrome/vendor/less.js; then
            echo "::error::The build has the placeholder, not the LESS compiler."
            exit 1
          fi

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          ( cd dist/chrome && zip -r -X "../../release/wikimedia-patched-chrome-$VERSION.zip" . )
          ( cd dist/firefox && zip -r -X "../../release/wikimedia-patched-firefox-$VERSION.zip" . )

      # Publish before signing, so a slow or failed signing costs only the
      # Firefox file, not the whole release. On a re-run the release is
      # already there, so refresh its zips instead.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip \
              --title "WikimediaPatched $VERSION" \
              --generate-notes \
              --verify-tag
          fi

      # AMO usually approves an unlisted version in minutes, but the signed
      # file can lag behind the approval email. Wait up to 30 minutes.
      - name: Sign for Firefox
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx --yes web-ext@8 sign \
            --source-dir dist/firefox \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 1800000 \
            --artifacts-dir web-ext-artifacts
          cp web-ext-artifacts/*.xpi "release/wikimedia-patched-firefox-$VERSION.xpi"

      # Only a signed XPI can update, so this comes only with one.
      - name: Write the Firefox update manifest
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/firefox-updates.mjs \
            "release/wikimedia-patched-firefox-$VERSION.xpi" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/wikimedia-patched-firefox-$VERSION.xpi" \
            release/updates.json

      - name: Attach the signed Firefox files
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "release/wikimedia-patched-firefox-$VERSION.xpi" \
            release/updates.json \
            --clobber
